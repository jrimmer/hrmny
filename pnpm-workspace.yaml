allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo@57.0.21
  - '@expo/ui@57.0.17'
  - expo-glass-effect@57.0.2
  - expo-router@57.0.20
  # The mobile round-4 adds (freshly published; the lockfile-wide policy gate
  # in the Docker web build refused them until aged):
  - '@expo/vector-icons@15.1.1'
  - expo-file-system@57.0.7
  - expo-image-manipulator@57.0.19
  - react-native-reanimated@4.7.0
  - react-native-worklets@0.13.0
onlyBuiltDependencies:
  - esbuild
packages:
  - apps/web
  - apps/desktop
  - apps/server
  - apps/mobile
  - apps/tui
  - packages/*
  - tools/*

overrides:
  react-native-worklets: 0.13.0
  # #125: CVE-2026-45822 (DoS) — rides the RUNTIME chain (query-string ->
  # expo-router); 0.5.0 is the fixed, API-compatible release.
  decode-uri-component: 0.5.0
  # 2026-10-05 Dependabot pass: patched releases inside each major already in
  # the tree. All ride build/test tooling (minimatch, ajv, postcss, Expo's dev
  # server, discord.js in the compat check tools) — none ships in the server image.
  brace-expansion@>=1 <2: ^1.1.21
  brace-expansion@>=2 <3: ^2.1.7
  brace-expansion@>=5 <6: ^5.0.12
  fast-uri@>=3 <4: ^3.1.8
  compression@>=1 <2: ^1.8.2
  source-map-js@>=1 <2: ^1.2.2
  undici@>=6 <7: ^6.28.1

patchedDependencies:
  react-native-worklets@0.13.0: patches/react-native-worklets@0.13.0.patch
